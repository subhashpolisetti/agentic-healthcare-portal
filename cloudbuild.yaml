steps:
  # Build Spring Boot backend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/demoprojectaihealthportal/healthportal/spring-backend:latest'
      - '-f'
      - 'spring-backend/Dockerfile'
      - 'spring-backend'

  # Build FastAPI AI service
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/demoprojectaihealthportal/healthportal/ai-service:latest'
      - '-f'
      - 'ai-service/Dockerfile'
      - 'ai-service'

images:
  - 'us-central1-docker.pkg.dev/demoprojectaihealthportal/healthportal/spring-backend:latest'
  - 'us-central1-docker.pkg.dev/demoprojectaihealthportal/healthportal/ai-service:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
