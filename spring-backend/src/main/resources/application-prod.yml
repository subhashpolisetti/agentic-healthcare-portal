spring:
  datasource:
    url: jdbc:mysql://${CLOUD_SQL_HOST}:${CLOUD_SQL_PORT:4000}/${CLOUD_SQL_DATABASE}?useSSL=true&requireSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${CLOUD_SQL_USER}
    password: ${CLOUD_SQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:https://agentichealthcare.subhashpolisetti.com}
  ai-service:
    url: ${AI_SERVICE_URL}
  redis:
    enabled: ${REDIS_ENABLED:false}
    url: ${REDIS_URL:redis://localhost:6379}
  pubsub:
    enabled: ${PUBSUB_ENABLED:false}
    project-id: ${GOOGLE_CLOUD_PROJECT:demoprojectaihealthportal}
    topic-appointment-booked: ${PUBSUB_TOPIC_BOOKED:appointment.booked}
    audience: ${PUBSUB_AUDIENCE:}
